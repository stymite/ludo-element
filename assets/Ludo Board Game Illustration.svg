<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 600" width="100%" height="100%">
  <!-- Outer board wrapper -->
  <rect width="600" height="600" fill="#F5F5F5" />

  <!-- Bases -->
  <!-- Top Left Base (RED) -->
  <g>
    <rect x="0" y="0" width="240" height="240" fill="#E53935" />
    <rect x="40" y="40" width="160" height="160" fill="#FFFFFF" rx="20" />
    <circle cx="80" cy="80" r="26.6" fill="#E53935" />
    <circle cx="160" cy="80" r="26.6" fill="#E53935" />
    <circle cx="80" cy="160" r="26.6" fill="#E53935" />
    <circle cx="160" cy="160" r="26.6" fill="#E53935" />
  </g>

  <!-- Top Right Base (GREEN) -->
  <g>
    <rect x="360" y="0" width="240" height="240" fill="#2E7D32" />
    <rect x="400" y="40" width="160" height="160" fill="#FFFFFF" rx="20" />
    <circle cx="440" cy="80" r="26.6" fill="#2E7D32" />
    <circle cx="520" cy="80" r="26.6" fill="#2E7D32" />
    <circle cx="440" cy="160" r="26.6" fill="#2E7D32" />
    <circle cx="520" cy="160" r="26.6" fill="#2E7D32" />
  </g>

  <!-- Bottom Right Base (YELLOW) -->
  <g>
    <rect x="360" y="360" width="240" height="240" fill="#F59E0B" />
    <rect x="400" y="400" width="160" height="160" fill="#FFFFFF" rx="20" />
    <circle cx="440" cy="440" r="26.6" fill="#F59E0B" />
    <circle cx="520" cy="440" r="26.6" fill="#F59E0B" />
    <circle cx="440" cy="520" r="26.6" fill="#F59E0B" />
    <circle cx="520" cy="520" r="26.6" fill="#F59E0B" />
  </g>

  <!-- Bottom Left Base (BLUE) -->
  <g>
    <rect x="0" y="360" width="240" height="240" fill="#1E88E5" />
    <rect x="40" y="400" width="160" height="160" fill="#FFFFFF" rx="20" />
    <circle cx="80" cy="440" r="26.6" fill="#1E88E5" />
    <circle cx="160" cy="440" r="26.6" fill="#1E88E5" />
    <circle cx="80" cy="520" r="26.6" fill="#1E88E5" />
    <circle cx="160" cy="520" r="26.6" fill="#1E88E5" />
  </g>

  <!-- Center Home Triangle -->
  <g>
    <!-- Top Triangle (GREEN) -->
    <polygon points="240,240 360,240 300,300" fill="#2E7D32" />
    <!-- Right Triangle (YELLOW) -->
    <polygon points="360,240 360,360 300,300" fill="#F59E0B" />
    <!-- Bottom Triangle (BLUE) -->
    <polygon points="360,360 240,360 300,300" fill="#1E88E5" />
    <!-- Left Triangle (RED) -->
    <polygon points="240,360 240,240 300,300" fill="#E53935" />
  </g>

  <!-- Path Cells -->
  <!-- Top track -->
  <!-- Col 6 -->
  <rect x="240" y="0" width="40" height="40" fill="#FFFFFF" stroke="#BDBDBD" stroke-width="1" />
  <rect x="240" y="40" width="40" height="40" fill="#FFFFFF" stroke="#BDBDBD" stroke-width="1" />
  <rect x="240" y="80" width="40" height="40" fill="#FFFFFF" stroke="#BDBDBD" stroke-width="1" />
  <rect x="240" y="120" width="40" height="40" fill="#FFFFFF" stroke="#BDBDBD" stroke-width="1" />
  <rect x="240" y="160" width="40" height="40" fill="#FFFFFF" stroke="#BDBDBD" stroke-width="1" />
  <rect x="240" y="200" width="40" height="40" fill="#FFFFFF" stroke="#BDBDBD" stroke-width="1" />
  <!-- Col 7 (GREEN home stretch) -->
  <rect x="280" y="0" width="40" height="40" fill="#FFFFFF" stroke="#BDBDBD" stroke-width="1" />
  <rect x="280" y="40" width="40" height="40" fill="#2E7D32" stroke="#BDBDBD" stroke-width="1" />
  <rect x="280" y="80" width="40" height="40" fill="#2E7D32" stroke="#BDBDBD" stroke-width="1" />
  <rect x="280" y="120" width="40" height="40" fill="#2E7D32" stroke="#BDBDBD" stroke-width="1" />
  <rect x="280" y="160" width="40" height="40" fill="#2E7D32" stroke="#BDBDBD" stroke-width="1" />
  <rect x="280" y="200" width="40" height="40" fill="#2E7D32" stroke="#BDBDBD" stroke-width="1" />
  <!-- Col 8 -->
  <rect x="320" y="0" width="40" height="40" fill="#FFFFFF" stroke="#BDBDBD" stroke-width="1" />
  <rect x="320" y="40" width="40" height="40" fill="#2E7D32" stroke="#BDBDBD" stroke-width="1" /> <!-- GREEN start -->
  <rect x="320" y="80" width="40" height="40" fill="#FFFFFF" stroke="#BDBDBD" stroke-width="1" />
  <rect x="320" y="120" width="40" height="40" fill="#FFFFFF" stroke="#BDBDBD" stroke-width="1" />
  <rect x="320" y="160" width="40" height="40" fill="#FFFFFF" stroke="#BDBDBD" stroke-width="1" />
  <rect x="320" y="200" width="40" height="40" fill="#FFFFFF" stroke="#BDBDBD" stroke-width="1" />

  <!-- Bottom track -->
  <!-- Col 6 -->
  <rect x="240" y="360" width="40" height="40" fill="#FFFFFF" stroke="#BDBDBD" stroke-width="1" />
  <rect x="240" y="400" width="40" height="40" fill="#FFFFFF" stroke="#BDBDBD" stroke-width="1" />
  <rect x="240" y="440" width="40" height="40" fill="#FFFFFF" stroke="#BDBDBD" stroke-width="1" />
  <rect x="240" y="480" width="40" height="40" fill="#FFFFFF" stroke="#BDBDBD" stroke-width="1" />
  <rect x="240" y="520" width="40" height="40" fill="#1E88E5" stroke="#BDBDBD" stroke-width="1" /> <!-- BLUE start -->
  <rect x="240" y="560" width="40" height="40" fill="#FFFFFF" stroke="#BDBDBD" stroke-width="1" />
  <!-- Col 7 (BLUE home stretch) -->
  <rect x="280" y="360" width="40" height="40" fill="#1E88E5" stroke="#BDBDBD" stroke-width="1" />
  <rect x="280" y="400" width="40" height="40" fill="#1E88E5" stroke="#BDBDBD" stroke-width="1" />
  <rect x="280" y="440" width="40" height="40" fill="#1E88E5" stroke="#BDBDBD" stroke-width="1" />
  <rect x="280" y="480" width="40" height="40" fill="#1E88E5" stroke="#BDBDBD" stroke-width="1" />
  <rect x="280" y="520" width="40" height="40" fill="#1E88E5" stroke="#BDBDBD" stroke-width="1" />
  <rect x="280" y="560" width="40" height="40" fill="#FFFFFF" stroke="#BDBDBD" stroke-width="1" />
  <!-- Col 8 -->
