  <rect x="0" y="280" width="40" height="40" fill="#FFFFFF" stroke="#BDBDBD" stroke-width="1" />
  <rect x="40" y="280" width="40" height="40" fill="#E53935" stroke="#BDBDBD" stroke-width="1" />
