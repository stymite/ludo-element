  <rect x="120" y="280" width="40" height="40" fill="#E53935" stroke="#BDBDBD" stroke-width="1" />
  <rect x="160" y="280" width="40" height="40" fill="#E53935" stroke="#BDBDBD" stroke-width="1" />
  <rect x="200" y="280" width="40" height="40" fill="#E53935" stroke="#BDBDBD" stroke-width="1" />
  <!-- Row 8 -->
  <rect x="0" y="320" width="40" height="40" fill="#FFFFFF" stroke="#BDBDBD" stroke-width="1" />
  <rect x="40" y="320" width="40" height="40" fill="#FFFFFF" stroke="#BDBDBD" stroke-width="1" />
  <rect x="80" y="320" width="40" height="40" fill="#FFFFFF" stroke="#BDBDBD" stroke-width="1" />
  <rect x="120" y="320" width="40" height="40" fill="#FFFFFF" stroke="#BDBDBD" stroke-width="1" />
  <rect x="160" y="320" width="40" height="40" fill="#FFFFFF" stroke="#BDBDBD" stroke-width="1" />
  <rect x="200" y="320" width="40" height="40" fill="#FFFFFF" stroke="#BDBDBD" stroke-width="1" />

