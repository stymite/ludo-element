  <rect x="480" y="280" width="40" height="40" fill="#F59E0B" stroke="#BDBDBD" stroke-width="1" />
  <rect x="520" y="280" width="40" height="40" fill="#F59E0B" stroke="#BDBDBD" stroke-width="1" />
  <rect x="560" y="280" width="40" height="40" fill="#FFFFFF" stroke="#BDBDBD" stroke-width="1" />
  <!-- Row 8 -->
  <rect x="360" y="320" width="40" height="40" fill="#FFFFFF" stroke="#BDBDBD" stroke-width="1" />
  <rect x="400" y="320" width="40" height="40" fill="#FFFFFF" stroke="#BDBDBD" stroke-width="1" />
  <rect x="440" y="320" width="40" height="40" fill="#FFFFFF" stroke="#BDBDBD" stroke-width="1" />
  <rect x="480" y="320" width="40" height="40" fill="#FFFFFF" stroke="#BDBDBD" stroke-width="1" />
  <rect x="520" y="320" width="40" height="40" fill="#F59E0B" stroke="#BDBDBD" stroke-width="1" /> <!-- YELLOW start -->
  <rect x="560" y="320" width="40" height="40" fill="#FFFFFF" stroke="#BDBDBD" stroke-width="1" />

  <!-- Safe Spots (Gray Star Tile Backgrounds) -->
  <rect x="80" y="200" width="40" height="40" fill="#E0E0E0" stroke="#BDBDBD" stroke-width="1" />
  <rect x="240" y="320" width="40" height="40" fill="#E0E0E0" stroke="#BDBDBD" stroke-width="1" />
  <rect x="320" y="80" width="40" height="40" fill="#E0E0E0" stroke="#BDBDBD" stroke-width="1" />
  <rect x="320" y="240" width="40" height="40" fill="#E0E0E0" stroke="#BDBDBD" stroke-width="1" />
  <rect x="480" y="80" width="40" height="40" fill="#E0E0E0" stroke="#BDBDBD" stroke-width="1" />
  <rect x="80" y="480" width="40" height="40" fill="#E0E0E0" stroke="#BDBDBD" stroke-width="1" />
  <rect x="240" y="480" width="40" height="40" fill="#E0E0E0" stroke="#BDBDBD" stroke-width="1" />
  <rect x="520" y="240" width="40" height="40" fill="#E0E0E0" stroke="#BDBDBD" stroke-width="1" />

  <!-- Start/Entry Arrows on Board edges -->
  <path d="M 8,248 L 32,260 L 8,272" stroke="#E53935" stroke-width="2" fill="none" />
  <path d="M 8,260 L 32,260" stroke="#E53935" stroke-width="2" />

  <path d="M 328,8 L 340,32 L 352,8" stroke="#2E7D32" stroke-width="2" fill="none" />
  <path d="M 340,8 L 340,32" stroke="#2E7D32" stroke-width="2" />

  <path d="M 592,328 L 568,340 L 592,352" stroke="#F59E0B" stroke-width="2" fill="none" />
  <path d="M 592,340 L 568,340" stroke="#F59E0B" stroke-width="2" />

  <path d="M 248,592 L 260,568 L 272,592" stroke="#1E88E5" stroke-width="2" fill="none" />
  <path d="M 260,592 L 260,568" stroke="#1E88E5" stroke-width="2" />

  <!-- Star shapes for Safe Spots -->
  <polygon points="100,210 106,233 88,219 112,219 94,233" fill="none" stroke="#212121" stroke-width="1" />
  <polygon points="260,330 266,353 248,339 272,339 254,353" fill="none" stroke="#212121" stroke-width="1" />
  <polygon points="340,90  346,113 328,99  352,99  334,113" fill="none" stroke="#212121" stroke-width="1" />
  <polygon points="500,90  506,113 488,99  512,99  494,113" fill="none" stroke="#212121" stroke-width="1" />
  <polygon points="100,490 106,513 88,499  112,499 94,513" fill="none" stroke="#212121" stroke-width="1" />
  <polygon points="260,490 266,513 248,499 272,499 254,513" fill="none" stroke="#212121" stroke-width="1" />
  <polygon points="540,250 546,273 528,259 552,259 534,273" fill="none" stroke="#212121" stroke-width="1" />
