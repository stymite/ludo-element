  <rect x="320" y="400" width="40" height="40" fill="#FFFFFF" stroke="#BDBDBD" stroke-width="1" />
  <rect x="320" y="440" width="40" height="40" fill="#FFFFFF" stroke="#BDBDBD" stroke-width="1" />
  <rect x="320" y="480" width="40" height="40" fill="#FFFFFF" stroke="#BDBDBD" stroke-width="1" />
  <rect x="320" y="520" width="40" height="40" fill="#FFFFFF" stroke="#BDBDBD" stroke-width="1" />
  <rect x="320" y="560" width="40" height="40" fill="#FFFFFF" stroke="#BDBDBD" stroke-width="1" />

  <!-- Left track -->
  <!-- Row 6 -->
  <rect x="0" y="240" width="40" height="40" fill="#FFFFFF" stroke="#BDBDBD" stroke-width="1" />
  <rect x="40" y="240" width="40" height="40" fill="#E53935" stroke="#BDBDBD" stroke-width="1" /> <!-- RED start -->
  <rect x="80" y="240" width="40" height="40" fill="#FFFFFF" stroke="#BDBDBD" stroke-width="1" />
  <rect x="120" y="240" width="40" height="40" fill="#FFFFFF" stroke="#BDBDBD" stroke-width="1" />
  <rect x="160" y="240" width="40" height="40" fill="#FFFFFF" stroke="#BDBDBD" stroke-width="1" />
  <rect x="200" y="240" width="40" height="40" fill="#FFFFFF" stroke="#BDBDBD" stroke-width="1" />
